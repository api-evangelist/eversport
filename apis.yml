apis:
- name: Eversports Provider API
  description: >-
    Read-only GraphQL API exposing activity schedules (classes, courses,
    workshops, trainings, events, camps, retreats, educations), activity groups,
    venues, companies, teachers, and per-activity checkout links for integrated
    Eversports Manager venues. Uses Relay-style cursor pagination. Access
    requires provider credentials issued by Eversports (contact
    support@eversports.com); pricing starts at EUR 50 per month per location.
  humanURL: https://helpcenter.eversportsmanager.com/what-is-the-provider-api
  baseURL: https://provider-api.eversportsmanager.io/api/graphql
  properties:
  - type: GraphQL
    url: graphql/eversport-provider-api.graphql
  - type: APIReference
    url: https://provider-api.eversportsmanager.io/api/graphql
  - type: Documentation
    url: https://helpcenter.eversportsmanager.com/what-is-the-provider-api
- name: Eversports Integration API (v2)
  description: >-
    Legacy JSON:API REST integration API used by aggregator and partner systems
    to manage users, venues, courts, and orders on the Eversports platform.
    Requests and responses follow the jsonapi.org format with the
    application/vnd.api+json media type; external systems use client-side IDs and
    PUT for order upserts.
  humanURL: https://gist.github.com/thomasfr/e236f256a29f748b7956
  baseURL: https://api.eversport.at/v2
