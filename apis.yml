name: Eversports
description: >-
  Eversports is a European sports and fitness activity platform founded in 2013
  and headquartered in Vienna, Austria. Its consumer marketplace lets people
  discover, book, and pay for classes, courts, and memberships across yoga,
  pilates, tennis, badminton, climbing and more, while Eversports Manager is the
  studio-management SaaS that venues use to run schedules, bookings, memberships,
  and payments. The platform facilitates roughly 1.5 million bookings per month
  for more than 4,000 active sport providers and 500,000 monthly active users.
  For developers, Eversports exposes a read-only GraphQL Provider API surfacing
  activity schedules, venues, teachers, and per-activity checkout links for
  integrated Eversports Manager venues, plus a legacy JSON:API REST integration
  API for users, venues, courts, and orders, and aggregator integrations with
  Urban Sports Club, Wellhub, ClassPass, EGYM Wellpass, and others.
