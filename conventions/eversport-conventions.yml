    mutations: none
    error_envelope:
      style: graphql
      shape: >-
        Errors are returned in the top-level `errors[]` array with `message`,
        `locations[]`, `path[]`, and an `extensions.code` machine code (e.g.
        GRAPHQL_PARSE_FAILED). See errors/eversport-problem-types.yml.
    idempotency: not-applicable (read-only API, no mutations)
  integration_api_v2:
    protocol: REST (JSON:API)
