    filtering:
      notes: >-
        List queries accept typed filter arguments rather than a generic query
        language, e.g. activities(venueIds, sportIds, teacherIds, roomIds,
        activityGroupTypes, timeRange, isCancelled, isArchived, hasOnlineStream,
        isBookableUnit, activityGroupPublicationStates).
